<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Flappy Bird</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #70c5ce;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 500px;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #70c5ce 0%,
            #70c5ce 82%,
            #ded895 82%,
            #ded895 87%,
            #9ad44b 87%,
            #9ad44b 100%
        );
}

/* Clouds */

.cloud {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    pointer-events: none;
}

.cloud1 {
    width: 90px;
    height: 35px;
    top: 15%;
    left: 10%;
}

.cloud1::before,
.cloud1::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud1::before {
    width: 45px;
    height: 45px;
    left: 15px;
    top: -20px;
}

.cloud1::after {
    width: 55px;
    height: 55px;
    right: 10px;
    top: -25px;
}

.cloud2 {
    width: 110px;
    height: 40px;
    top: 28%;
    right: 8%;
}

.cloud2::before,
.cloud2::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud2::before {
    width: 50px;
    height: 50px;
    left: 15px;
    top: -20px;
}

.cloud2::after {
    width: 65px;
    height: 65px;
    right: 10px;
    top: -30px;
}

/* Bird */

#bird {
    position: absolute;

    width: 46px;
    height: 46px;

    object-fit: contain;

    left: 24%;
    top: 45%;

    z-index: 20;

    transform-origin: center;
    pointer-events: none;
}

/* Pipes */

#pipes {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.pipeGroup {
    position: absolute;

    left: 0;
    top: 0;

    width: 72px;
    height: 100%;

    pointer-events: none;
}

.pipePiece {
    position: absolute;

    left: 0;

    width: 72px;

    display: block;

    pointer-events: none;
}

.pipeTop {
    transform: rotate(180deg);
}

.pipeBottom {
    transform: none;
}

/* Score */

#score {
    position: absolute;

    top: 70px;
    left: 0;

    width: 100%;

    text-align: center;

    z-index: 50;

    font-size: 52px;
    font-weight: 900;

    color: white;

    text-shadow:
        3px 3px 0 #555,
        -2px -2px 0 #555,
        2px -2px 0 #555,
        -2px 2px 0 #555;

    pointer-events: none;
}

/* Ground */

#ground {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 13%;

    background:
        repeating-linear-gradient(
            135deg,
            #8ed13f 0,
            #8ed13f 12px,
            #7bc536 12px,
            #7bc536 24px
        );

    border-top: 5px solid #6eaa31;

    z-index: 30;

    pointer-events: none;
}

/* Overlay */

#overlay {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.18);

    text-align: center;
}

#overlay.hidden {
    display: none;
}

#title {
    margin: 0 0 15px;

    color: white;

    font-size: 48px;
    font-weight: 900;

    text-shadow:
        4px 4px 0 #555,
        -2px -2px 0 #555;
}

#message {
    margin: 0 20px 25px;

    color: white;

    font-size: 18px;
    font-weight: bold;

    line-height: 1.5;

    text-shadow: 2px 2px 0 #555;
}

#startButton {
    border: 4px solid #555;
    border-radius: 10px;

    padding: 12px 30px;

    background: #f5d547;

    color: #333;

    font-size: 22px;
    font-weight: 900;

    cursor: pointer;

    box-shadow: 0 5px 0 #777;
}

#startButton:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #777;
}
</style>
</head>

<body>

<div id="game">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div id="score">0</div>

    <img
        id="bird"
        src="./assets/bird.PNG"
        alt="Bird"
    >

    <div id="pipes"></div>

    <div id="ground"></div>

    <div id="overlay">

        <h1 id="title">FLAPPY</h1>

        <p id="message">
            Tap, click, or press SPACE to flap
        </p>

        <button id="startButton">
            START
        </button>

    </div>

</div>

<script>
"use strict";

/* ==============================
   GAME SETTINGS
============================== */

const GAME = {
    gravity: 0.42,
    flapStrength: -7.2,

    birdSize: 46,

    pipeWidth: 72,

    pipeGap: 155,

    pipeSpeed: 3.1,

    pipeSpacing: 240,

    groundHeight: 13
};


/* ==============================
   PIPE ASSET DIMENSIONS
============================== */

const PIPE = {

    mainWidth: 355,
    mainHeight: 393,

    halfWidth: 355,
    halfHeight: 278,

    displayWidth: GAME.pipeWidth,

    halfCount: 6
};


/*
    Keep the original aspect ratios.

    pipe.PNG:
    355 × 393

    pipehalf.PNG:
    355 × 278
*/

PIPE.mainDisplayHeight =
    PIPE.displayWidth *
    (PIPE.mainHeight / PIPE.mainWidth);

PIPE.halfDisplayHeight =
    PIPE.displayWidth *
    (PIPE.halfHeight / PIPE.halfWidth);


/* ==============================
   ELEMENTS
============================== */

const game =
    document.getElementById("game");

const bird =
    document.getElementById("bird");

const pipesContainer =
    document.getElementById("pipes");

const scoreElement =
    document.getElementById("score");

const overlay =
    document.getElementById("overlay");

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const startButton =
    document.getElementById("startButton");


/* ==============================
   GAME STATE
============================== */

let birdY = 0;
let birdVelocity = 0;
let birdRotation = 0;

let pipes = [];

let score = 0;

let bestScore =
    Number(
        localStorage.getItem("flappyBest") || 0
    );

let running = false;

let animationFrame = 0;

let lastTime = 0;


/* ==============================
   GAME DIMENSIONS
============================== */

function getGameWidth() {
    return game.clientWidth;
}

function getGameHeight() {
    return game.clientHeight;
}

function getGroundY() {
    return getGameHeight() *
        (1 - GAME.groundHeight / 100);
}


/* ==============================
   RESET
============================== */

function resetGame() {

    cancelAnimationFrame(animationFrame);

    pipesContainer.innerHTML = "";

    pipes = [];

    score = 0;

    scoreElement.textContent = "0";

    birdY =
        getGameHeight() * 0.45;

    birdVelocity = 0;

    birdRotation = 0;

    bird.style.left =
        `${getGameWidth() * 0.24}px`;

    bird.style.top =
        `${birdY}px`;

    bird.style.transform =
        "rotate(0deg)";

    running = false;

    lastTime = 0;
}


/* ==============================
   START
============================== */

function startGame() {

    resetGame();

    overlay.classList.add("hidden");

    running = true;

    createInitialPipes();

    flap();

    lastTime = performance.now();

    animationFrame =
        requestAnimationFrame(gameLoop);
}


/* ==============================
   FLAP
============================== */

function flap() {

    if (!running) return;

    birdVelocity =
        GAME.flapStrength;
}


/* ==============================
   CREATE PIPE PIECE
============================== */

function createPipePiece(
    group,
    image,
    top,
    className
) {

    const piece =
        document.createElement("img");

    piece.src = image;

    piece.className =
        `pipePiece ${className}`;

    piece.style.top =
        `${top}px`;

    piece.style.width =
        `${PIPE.displayWidth}px`;

    if (
        image.includes("pipehalf")
    ) {

        piece.style.height =
            `${PIPE.halfDisplayHeight}px`;

    } else {

        piece.style.height =
            `${PIPE.mainDisplayHeight}px`;
    }

    group.appendChild(piece);

    return piece;
}


/* ==============================
   BUILD TOP PIPE
============================== */

function buildTopPipe(
    group,
    gapTop
) {

    const mainHeight =
        PIPE.mainDisplayHeight;

    const halfHeight =
        PIPE.halfDisplayHeight;


    /*
        Main pipe touches the
        bottom of the top pipe.
    */

    const mainTop =
        gapTop - mainHeight;


    createPipePiece(
        group,
        "./assets/pipe.PNG",
        mainTop,
        "pipeTop"
    );


    /*
        Exactly 6 pipehalf pieces
        extend upward.
    */

    let currentTop =
        mainTop;

    for (
        let i = 0;
        i < PIPE.halfCount;
        i++
    ) {

        currentTop -= halfHeight;

        createPipePiece(
            group,
            "./assets/pipehalf.PNG",
            currentTop,
            "pipeTop"
        );
    }
}


/* ==============================
   BUILD BOTTOM PIPE
============================== */

function buildBottomPipe(
    group,
    gapBottom
) {

    const mainHeight =
        PIPE.mainDisplayHeight;

    const halfHeight =
        PIPE.halfDisplayHeight;


    /*
        Main pipe starts immediately
        after the gap.
    */

    let currentTop =
        gapBottom;


    createPipePiece(
        group,
        "./assets/pipe.PNG",
        currentTop,
        "pipeBottom"
    );


    currentTop += mainHeight;


    /*
        Exactly 6 pipehalf pieces
        extend downward.
    */

    for (
        let i = 0;
        i < PIPE.halfCount;
        i++
    ) {

        createPipePiece(
            group,
            "./assets/pipehalf.PNG",
            currentTop,
            "pipeBottom"
        );

        currentTop += halfHeight;
    }
}


/* ==============================
   CREATE PIPE
============================== */

function createPipe(x) {

    const floor =
        getGroundY();


    const minimumGapTop = 100;

    const maximumGapTop =
        floor -
        GAME.pipeGap -
        70;


    const gapTop =
        minimumGapTop +
        Math.random() *
        Math.max(
            1,
            maximumGapTop -
            minimumGapTop
        );


    const gapBottom =
        gapTop +
        GAME.pipeGap;


    const group =
        document.createElement("div");

    group.className =
        "pipeGroup";

    group.style.left =
        `${x}px`;


    buildTopPipe(
        group,
        gapTop
    );

    buildBottomPipe(
        group,
        gapBottom
    );


    pipesContainer.appendChild(group);


    pipes.push({

        x,

        gapTop,

        gapBottom,

        element: group,

        scored: false
    });
}


/* ==============================
   INITIAL PIPE
============================== */

function createInitialPipes() {

    createPipe(
        getGameWidth() + 100
    );
}


/* ==============================
   UPDATE PIPES
============================== */

function updatePipes(delta) {

    const multiplier =
        delta / 16.67;


    for (
        let i = pipes.length - 1;
        i >= 0;
        i--
    ) {

        const pipe =
            pipes[i];


        pipe.x -=
            GAME.pipeSpeed *
            multiplier;


        pipe.element.style.left =
            `${pipe.x}px`;


        /*
            Score when the pipe
            passes the bird.
        */

        if (
            !pipe.scored &&
            pipe.x +
            GAME.pipeWidth <
            getGameWidth() * 0.24
        ) {

            pipe.scored = true;

            score++;

            scoreElement.textContent =
                score;
        }


        /*
            Remove pipes after
            they are completely
            off-screen.
        */

        if (
            pipe.x +
            GAME.pipeWidth <
            -50
        ) {

            pipe.element.remove();

            pipes.splice(i, 1);
        }
    }


    /*
        Create the next pipe.
    */

    const lastPipe =
        pipes[pipes.length - 1];


    if (
        !lastPipe ||
        lastPipe.x <
        getGameWidth() -
        GAME.pipeSpacing
    ) {

        createPipe(
            getGameWidth() + 30
        );
    }
}


/* ==============================
   COLLISION
============================== */

function checkCollision() {

    const birdLeft =
        getGameWidth() * 0.24;

    const birdRight =
        birdLeft +
        GAME.birdSize;


    const birdTop =
        birdY + 5;

    const birdBottom =
        birdY +
        GAME.birdSize -
        5;


    const groundY =
        getGroundY();


    /*
        Ground collision.
    */

    if (
        birdBottom >= groundY
    ) {
        return true;
    }


    /*
        Ceiling collision.
    */

    if (
        birdTop <= 0
    ) {
        return true;
    }


    /*
        Pipe collision.
    */

    for (
        const pipe of pipes
    ) {

        const pipeLeft =
            pipe.x;

        const pipeRight =
            pipe.x +
            GAME.pipeWidth;


        const horizontalOverlap =
            birdRight > pipeLeft &&
            birdLeft < pipeRight;


        if (
            !horizontalOverlap
        ) {
            continue;
        }


        /*
            The bird must stay
            completely inside the gap.
        */

        if (
            birdTop <
            pipe.gapTop ||
            birdBottom >
            pipe.gapBottom
        ) {

            return true;
        }
    }


    return false;
}


/* ==============================
   GAME OVER
============================== */

function gameOver() {

    running = false;


    if (
        score > bestScore
    ) {

        bestScore = score;

        localStorage.setItem(
            "flappyBest",
            String(bestScore)
        );
    }


    title.textContent =
        "GAME OVER";


    message.innerHTML =
        `Score: ${score}<br>` +
        `Best: ${bestScore}`;


    startButton.textContent =
        "PLAY AGAIN";


    overlay.classList.remove(
        "hidden"
    );


    cancelAnimationFrame(
        animationFrame
    );
}


/* ==============================
   GAME LOOP
============================== */

function gameLoop(time) {

    if (!running) {
        return;
    }


    if (!lastTime) {
        lastTime = time;
    }


    let delta =
        time - lastTime;


    delta =
        Math.min(delta, 35);


    lastTime = time;


    const multiplier =
        delta / 16.67;


    /*
        Gravity.
    */

    birdVelocity +=
        GAME.gravity *
        multiplier;


    /*
        Bird movement.
    */

    birdY +=
        birdVelocity *
        multiplier;


    /*
        Bird rotation.
    */

    birdRotation =
        Math.max(
            -25,
            Math.min(
                90,
                birdVelocity * 6
            )
        );


    bird.style.top =
        `${birdY}px`;


    bird.style.transform =
        `rotate(${birdRotation}deg)`;


    /*
        Move pipes.
    */

    updatePipes(delta);


    /*
        Collision check.
    */

    if (
        checkCollision()
    ) {

        gameOver();

        return;
    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* ==============================
   INPUT
============================== */

function handleInput(event) {

    if (event) {
        event.preventDefault();
    }


    if (!running) {

        startGame();

        return;
    }


    flap();
}


/* ==============================
   BUTTON
============================== */

startButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        event.stopPropagation();

        startGame();
    }
);


/* ==============================
   TOUCH / MOUSE
============================== */

game.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target === startButton
        ) {
            return;
        }

        handleInput(event);
    }
);


/* ==============================
   KEYBOARD
============================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            handleInput(event);
        }
    }
);


/* ==============================
   RESIZE
============================== */

window.addEventListener(
    "resize",
    function() {

        if (!running) {

            birdY =
                getGameHeight() *
                0.45;

            bird.style.top =
                `${birdY}px`;
        }
    }
);


/* ==============================
   IMAGE ERROR CHECK
============================== */

bird.addEventListener(
    "error",
    function() {

        console.error(
            "Could not load ./assets/bird.PNG"
        );
    }
);


/* ==============================
   INITIALIZE
============================== */

resetGame();

message.textContent =
    "Tap, click, or press SPACE to flap";

startButton.textContent =
    "START";
</script>

</body>
</html>
