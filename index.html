<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Flappy Bird</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #70c5ce;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   GAME
========================= */

#game {
    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 500px;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #70c5ce 0%,
            #70c5ce 82%,
            #ded895 82%,
            #ded895 87%,
            #9ad44b 87%,
            #9ad44b 100%
        );
}


/* =========================
   CLOUDS
========================= */

.cloud {
    position: absolute;

    background: rgba(255,255,255,0.75);

    border-radius: 50px;

    filter: blur(1px);

    pointer-events: none;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background: inherit;

    border-radius: 50%;
}

.cloud::before {
    width: 55%;
    height: 140%;

    left: 15%;
    bottom: 0;
}

.cloud::after {
    width: 45%;
    height: 120%;

    right: 10%;
    bottom: 0;
}

.cloud1 {
    width: 110px;
    height: 30px;

    top: 12%;
    left: 10%;
}

.cloud2 {
    width: 140px;
    height: 35px;

    top: 25%;
    right: -20px;
}

.cloud3 {
    width: 90px;
    height: 25px;

    top: 42%;
    left: -20px;
}


/* =========================
   BIRD
========================= */

#bird {
    position: absolute;

    width: 46px;
    height: 46px;

    object-fit: contain;

    left: 24%;
    top: 45%;

    z-index: 20;

    transform-origin: center;

    pointer-events: none;
}


/* =========================
   PIPE SYSTEM
========================= */

.pipeGroup {
    position: absolute;

    left: 0;
    top: 0;

    width: 72px;
    height: 100%;

    z-index: 10;

    pointer-events: none;
}


/*
    Every individual pipe image keeps
    its natural proportions.

    355px wide source images are displayed
    at 72px wide.
*/

.pipePiece {
    position: absolute;

    left: 0;

    width: 72px;

    display: block;

    pointer-events: none;
}


/*
    Top pipe pieces are flipped so the
    pipe opening faces downward.
*/

.pipeTop {
    transform: rotate(180deg);
}


/*
    Bottom pieces remain normal.
*/

.pipeBottom {
    transform: none;
}


/* =========================
   SCORE
========================= */

#score {
    position: absolute;

    top: 70px;
    left: 0;

    width: 100%;

    text-align: center;

    z-index: 50;

    font-size: 52px;

    font-weight: 900;

    color: white;

    text-shadow:
        3px 3px 0 #555,
        -2px -2px 0 #555,
        2px -2px 0 #555,
        -2px 2px 0 #555;

    pointer-events: none;
}


/* =========================
   OVERLAY
========================= */

#overlay {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: rgba(0,0,0,0.18);
}

#title {
    margin: 0 0 10px;

    font-size: 48px;

    font-weight: 900;

    color: white;

    text-shadow:
        4px 4px 0 #555,
        -2px -2px 0 #555;
}

#message {
    margin: 0 0 25px;

    color: white;

    font-size: 20px;

    font-weight: bold;

    text-align: center;

    text-shadow:
        2px 2px 0 #555;
}

#startButton {
    border: 0;

    border-radius: 12px;

    padding: 15px 32px;

    background: #f7d51d;

    color: #5b4300;

    font-size: 21px;

    font-weight: 900;

    box-shadow:
        0 5px 0 #b49600,
        0 8px 15px rgba(0,0,0,0.25);

    cursor: pointer;

    touch-action: manipulation;
}

#startButton:active {
    transform: translateY(4px);

    box-shadow:
        0 1px 0 #b49600,
        0 4px 8px rgba(0,0,0,0.25);
}

.hidden {
    display: none !important;
}


/* =========================
   GROUND
========================= */

#ground {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 13%;

    background:
        repeating-linear-gradient(
            135deg,
            #8ed13f 0px,
            #8ed13f 12px,
            #7bc536 12px,
            #7bc536 24px
        );

    border-top: 5px solid #6eaa31;

    z-index: 30;

    pointer-events: none;
}
</style>
</head>


<body>

<div id="game">

    <!-- CLOUDS -->

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>


    <!-- SCORE -->

    <div id="score">0</div>


    <!-- BIRD -->

    <img
        id="bird"
        src="./assets/bird.PNG"
        alt="Bird"
    >


    <!-- PIPES -->

    <div id="pipes"></div>


    <!-- GROUND -->

    <div id="ground"></div>


    <!-- START SCREEN -->

    <div id="overlay">

        <h1 id="title">
            FLAPPY
        </h1>

        <p id="message">
            Tap, click, or press SPACE to flap
        </p>

        <button id="startButton">
            START
        </button>

    </div>

</div>


<script>
"use strict";


/* =========================
   SETTINGS
========================= */

const GAME = {

    gravity: 0.42,

    flapStrength: -7.2,

    birdSize: 46,

    pipeWidth: 72,

    pipeGap: 155,

    pipeSpeed: 3.1,

    pipeSpacing: 240,

    groundHeight: 13
};


/*
    Original image dimensions:

    pipe.PNG:
    355 × 450

    pipehalf.PNG:
    355 × 300
*/

const PIPE = {

    mainWidth: 355,

    mainHeight: 450,

    halfWidth: 355,

    halfHeight: 300,

    displayWidth: GAME.pipeWidth
};


/*
    Calculate displayed heights while
    preserving the original aspect ratio.
*/

PIPE.mainDisplayHeight =
    PIPE.displayWidth *
    (PIPE.mainHeight / PIPE.mainWidth);

PIPE.halfDisplayHeight =
    PIPE.displayWidth *
    (PIPE.halfHeight / PIPE.halfWidth);


/* =========================
   ELEMENTS
========================= */

const game =
    document.getElementById("game");

const bird =
    document.getElementById("bird");

const pipesContainer =
    document.getElementById("pipes");

const scoreElement =
    document.getElementById("score");

const overlay =
    document.getElementById("overlay");

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const startButton =
    document.getElementById("startButton");


/* =========================
   STATE
========================= */

let birdY = 0;

let birdVelocity = 0;

let birdRotation = 0;

let pipes = [];

let score = 0;

let bestScore =
    Number(
        localStorage.getItem("flappyBest") || 0
    );

let running = false;

let animationFrame = 0;

let lastTime = 0;


/* =========================
   GAME SIZE
========================= */

function getGameWidth() {

    return game.clientWidth;
}


function getGameHeight() {

    return game.clientHeight;
}


function getGroundY() {

    return (
        getGameHeight() *
        (1 - GAME.groundHeight / 100)
    );
}


/* =========================
   RESET
========================= */

function resetGame() {

    cancelAnimationFrame(
        animationFrame
    );

    pipesContainer.innerHTML = "";

    pipes = [];

    score = 0;

    scoreElement.textContent = "0";


    birdY =
        getGameHeight() * 0.45;

    birdVelocity = 0;

    birdRotation = 0;


    bird.style.left =
        `${getGameWidth() * 0.24}px`;

    bird.style.top =
        `${birdY}px`;

    bird.style.transform =
        "rotate(0deg)";


    running = false;

    lastTime = 0;
}


/* =========================
   START
========================= */

function startGame() {

    resetGame();

    overlay.classList.add(
        "hidden"
    );

    running = true;


    /*
        Create first pipe.
    */

    createInitialPipes();


    /*
        Start bird.
    */

    flap();


    lastTime =
        performance.now();


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================
   FLAP
========================= */

function flap() {

    if (!running) {
        return;
    }

    birdVelocity =
        GAME.flapStrength;
}


/* =========================
   CREATE PIPE PIECE
========================= */

function createPipePiece(
    group,
    image,
    top,
    className
) {

    const piece =
        document.createElement("img");

    piece.src =
        image;

    piece.className =
        `pipePiece ${className}`;

    piece.style.top =
        `${top}px`;

    piece.style.width =
        `${PIPE.displayWidth}px`;


    /*
        Main pipe:
        355 × 450

        Half pipe:
        355 × 300
    */

    if (
        image.includes("pipehalf")
    ) {

        piece.style.height =
            `${PIPE.halfDisplayHeight}px`;

    } else {

        piece.style.height =
            `${PIPE.mainDisplayHeight}px`;
    }


    group.appendChild(
        piece
    );


    return piece;
}


/* =========================
   BUILD TOP PIPE
========================= */

function buildTopPipe(
    group,
    gapTop
) {

    /*
        The main pipe sits directly
        against the bottom of the top
        extension.

        Then half pieces continue
        upward until completely off-screen.
    */

    const mainHeight =
        PIPE.mainDisplayHeight;

    const halfHeight =
        PIPE.halfDisplayHeight;


    /*
        Main pipe bottom touches gap.
    */

    let currentBottom =
        gapTop;


    /*
        Main pipe.
    */

    const mainTop =
        currentBottom -
        mainHeight;


    createPipePiece(
        group,
        "./assets/pipe.PNG",
        mainTop,
        "pipeTop"
    );


    currentBottom =
        mainTop;


    /*
        Keep adding half pieces upward
        until they cover the entire
        area above the screen.
    */

    while (
        currentBottom > -halfHeight
    ) {

        currentBottom -=
            halfHeight;

        createPipePiece(
            group,
            "./assets/pipehalf.PNG",
            currentBottom,
            "pipeTop"
        );
    }
}


/* =========================
   BUILD BOTTOM PIPE
========================= */

function buildBottomPipe(
    group,
    gapBottom
) {

    const mainHeight =
        PIPE.mainDisplayHeight;

    const halfHeight =
        PIPE.halfDisplayHeight;


    /*
        Main pipe begins at the gap.
    */

    let currentTop =
        gapBottom;


    createPipePiece(
        group,
        "./assets/pipe.PNG",
        currentTop,
        "pipeBottom"
    );


    currentTop +=
        mainHeight;


    /*
        Keep adding half pieces downward
        until they are completely past
        the ground.
    */

    const groundY =
        getGroundY();


    while (
        currentTop <
        groundY + halfHeight
    ) {

        createPipePiece(
            group,
            "./assets/pipehalf.PNG",
            currentTop,
            "pipeBottom"
        );


        currentTop +=
            halfHeight;
    }
}


/* =========================
   CREATE PIPE
========================= */

function createPipe(x) {

    const floor =
        getGroundY();


    /*
        Gap location.

        Keep enough room above and
        below the gap for gameplay.
    */

    const minimumGapTop = 100;

    const maximumGapTop =
        floor -
        GAME.pipeGap -
        70;


    const gapTop =
        minimumGapTop +
        Math.random() *
        Math.max(
            1,
            maximumGapTop -
            minimumGapTop
        );


    const gapBottom =
        gapTop +
        GAME.pipeGap;


    /*
        One group controls both pipe
        halves, making them move together.
    */

    const group =
        document.createElement("div");

    group.className =
        "pipeGroup";


    group.style.left =
        `${x}px`;


    /*
        Build top and bottom.
    */

    buildTopPipe(
        group,
        gapTop
    );

    buildBottomPipe(
        group,
        gapBottom
    );


    pipesContainer.appendChild(
        group
    );


    /*
        Store pipe collision information.
    */

    pipes.push({

        x: x,

        gapTop: gapTop,

        gapBottom: gapBottom,

        element: group,

        scored: false
    });
}


/* =========================
   FIRST PIPE
========================= */

function createInitialPipes() {

    createPipe(
        getGameWidth() + 100
    );
}


/* =========================
   UPDATE PIPES
========================= */

function updatePipes(delta) {

    const multiplier =
        delta / 16.67;


    for (
        let i = pipes.length - 1;
        i >= 0;
        i--
    ) {

        const pipe =
            pipes[i];


        pipe.x -=
            GAME.pipeSpeed *
            multiplier;


        pipe.element.style.left =
            `${pipe.x}px`;


        /*
            SCORE
        */

        if (
            !pipe.scored &&

            pipe.x +
            GAME.pipeWidth <

            getGameWidth() * 0.24
        ) {

            pipe.scored = true;

            score++;

            scoreElement.textContent =
                score;
        }


        /*
            REMOVE PIPE
        */

        if (
            pipe.x +
            GAME.pipeWidth <
            -50
        ) {

            pipe.element.remove();

            pipes.splice(
                i,
                1
            );
        }
    }


    /*
        CREATE NEXT PIPE
    */

    const lastPipe =
        pipes[pipes.length - 1];


    if (
        !lastPipe ||

        lastPipe.x <
        getGameWidth() -
        GAME.pipeSpacing
    ) {

        createPipe(
            getGameWidth() + 30
        );
    }
}


/* =========================
   COLLISION
========================= */

function checkCollision() {

    const birdLeft =
        getGameWidth() * 0.24;

    const birdRight =
        birdLeft +
        GAME.birdSize;


    const birdTop =
        birdY + 5;

    const birdBottom =
        birdY +
        GAME.birdSize -
        5;


    const groundY =
        getGroundY();


    /*
        Ground.
    */

    if (
        birdBottom >= groundY
    ) {

        return true;
    }


    /*
        Ceiling.
    */

    if (
        birdTop <= 0
    ) {

        return true;
    }


    /*
        Pipes.

        We only need to test the
        horizontal pipe column and
        the gap.
    */

    for (
        const pipe of pipes
    ) {

        const pipeLeft =
            pipe.x;

        const pipeRight =
            pipe.x +
            GAME.pipeWidth;


        const horizontalOverlap =
            birdRight > pipeLeft &&
            birdLeft < pipeRight;


        if (!horizontalOverlap) {
            continue;
        }


        /*
            Bird is inside either
            pipe section.
        */

        if (
            birdTop <
            pipe.gapTop ||

            birdBottom >
            pipe.gapBottom
        ) {

            return true;
        }
    }


    return false;
}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    running = false;


    if (
        score >
        bestScore
    ) {

        bestScore = score;

        localStorage.setItem(
            "flappyBest",
            String(bestScore)
        );
    }


    title.textContent =
        "GAME OVER";


    message.innerHTML =
        `Score: ${score}<br>Best: ${bestScore}`;


    startButton.textContent =
        "PLAY AGAIN";


    overlay.classList.remove(
        "hidden"
    );


    cancelAnimationFrame(
        animationFrame
    );
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

    if (!running) {
        return;
    }


    if (!lastTime) {
        lastTime = time;
    }


    let delta =
        time - lastTime;


    /*
        Prevent giant physics jumps
        after a browser pause.
    */

    delta =
        Math.min(
            delta,
            35
        );


    lastTime = time;


    const multiplier =
        delta / 16.67;


    /*
        GRAVITY
    */

    birdVelocity +=
        GAME.gravity *
        multiplier;


    birdY +=
        birdVelocity *
        multiplier;


    /*
        ROTATION
    */

    birdRotation =
        Math.max(
            -25,

            Math.min(
                90,

                birdVelocity * 6
            )
        );


    bird.style.top =
        `${birdY}px`;


    bird.style.transform =
        `rotate(${birdRotation}deg)`;


    /*
        PIPES
    */

    updatePipes(
        delta
    );


    /*
        COLLISION
    */

    if (
        checkCollision()
    ) {

        gameOver();

        return;
    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================
   INPUT
========================= */

function handleInput(event) {

    if (event) {
        event.preventDefault();
    }


    if (!running) {

        startGame();

        return;
    }


    flap();
}


/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
    "pointerdown",

    function(event) {

        event.preventDefault();

        event.stopPropagation();

        startGame();
    }
);


/* =========================
   TOUCH / MOUSE
========================= */

game.addEventListener(
    "pointerdown",

    function(event) {

        if (
            event.target ===
            startButton
        ) {

            return;
        }


        handleInput(
            event
        );
    }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",

    function(event) {

        if (
            event.code === "Space" ||

            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            handleInput(
                event
            );
        }
    }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",

    function() {

        if (!running) {

            birdY =
                getGameHeight() *
                0.45;


            bird.style.top =
                `${birdY}px`;
        }
    }
);


/* =========================
   IMAGE ERRORS
========================= */

bird.addEventListener(
    "error",

    function() {

        console.error(
            "Could not load ./assets/bird.PNG"
        );
    }
);


/* =========================
   INITIALIZE
========================= */

resetGame();

message.textContent =
    "Tap, click, or press SPACE to flap";

startButton.textContent =
    "START";
</script>

</body>
</html>
